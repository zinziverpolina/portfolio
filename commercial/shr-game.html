<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Sacred Stack — Polina Zinziver</title>
<meta name="description" content="Sacred Stack: a one-tap stacking game with the creatures of Sacred Hyper Race, a Fortnite map by Polina Zinziver.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;700&family=Bricolage+Grotesque:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shr-game.css?v=1">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<main class="sg is-start" id="sg">
  <div class="sg-ruler" aria-hidden="true"></div>
  <canvas class="sg-canvas" aria-label="Sacred Stack game"></canvas>
  <div class="sg-frames" aria-hidden="true"></div>

  <nav class="sg-nav">
    <a href="../commercial.html">POLINA ZINZIVER</a>
    <a href="sacred-hyper-race.html">SACRED HYPER RACE</a>
  </nav>
  <button class="sg-sound" type="button" aria-pressed="false">SOUND OFF</button>

  <div class="sg-score" hidden>
    <div class="sg-box"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      <b class="sg-score-n">0</b>
    </div>
    <span class="sg-score-tag">STACKED · BEST <span class="sg-best-n">0</span></span>
  </div>

  <section class="sg-screen sg-start">
    <h1>SACRED STACK</h1>
    <p>tap to drop · stack the creatures</p>
    <div class="sg-go"><span class="sg-load">LOADING 0/12</span><span class="sg-tap">TAP TO START</span></div>
  </section>

  <section class="sg-screen sg-over" hidden>
    <div class="sg-box sg-over-box"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      <span class="sg-over-cause">TOPPLED</span>
      <b class="sg-over-n">0</b>
      <span class="sg-over-best">BEST 0</span>
    </div>
    <div class="sg-go"><span class="sg-tap">TAP TO RESTART</span></div>
  </section>

  <div class="sg-flash" aria-hidden="true"></div>
  <div class="sg-pop" aria-hidden="true">PERFECT +1</div>
</main>
<script type="module" src="shr-game.js?v=1"></script>
</body>
</html>
